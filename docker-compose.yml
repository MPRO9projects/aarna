services:
  aarna-web:
    image: ghcr.io/infompro9-maker/aarna:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aarna-web
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "5010:5010"
    volumes:
      - ./backend/data:/app/backend/data
      - ./backend/uploads:/app/backend/uploads
      - ./backend/private-data:/app/backend/private-data
